[project]
name = "taste-engine"
version = "0.1.0"
description = "Cross-domain recommendation system (movies + music), built on real MovieLens and Last.fm data"
readme = "VERIFY.md"
requires-python = ">=3.10"
dependencies = [
    "implicit>=0.7.2",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "truststore>=0.9",
    "h5py>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
]